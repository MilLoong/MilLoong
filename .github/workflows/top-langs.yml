name: Generate top languages card

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00（按需修改）
  workflow_dispatch:     # 允许手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&hide_title=true&title_color=3498db&icon_color=3498db&card_width=880
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&hide_title=true&theme=dark&title_color=3498db&icon_color=3498db&card_width=880
          path: dist/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compact language card layout
        run: python3 scripts/compact_top_langs.py dist/top-langs.svg dist/top-langs-dark.svg

      - name: Commit generated images (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/top-langs.svg dist/top-langs-dark.svg || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update top languages card"
            git push
          fi
